name: Automated Test Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  pull_request:
    branches:
      - 'master'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    env:
      Solution_Name: WindBot.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      run: nuget restore $env:Solution_Name

    - name: Build
      run: msbuild $env:Solution_Name /t:Build /p:Configuration=Release /p:Platform=x64

    - name: Pack
      run: |
        mkdir dist
        xcopy /e /y bin\Release dist\WindBot\
        xcopy /y BotWrapper\bin\Release\bot.conf dist\
        xcopy /y BotWrapper\bin\Release\load-once.conf dist\
        xcopy /y BotWrapper\bin\Release\bot.exe dist\

    - name: Upload Artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: windbot-release
        path: dist

  mono-build:
    runs-on: ubuntu-latest
    container:
      image: mono:6.8.0.123

    env:
      Solution_Name: WindBot.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build with Mono MSBuild
      run: msbuild "$Solution_Name" /restore /t:Build /p:Configuration=Release /p:Platform=x64

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download Artifact
      uses: actions/download-artifact@v8
      with:
        name: windbot-release
        path: dist

    - name: GitHub Release
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        TAG_NAME: "${{ github.ref_name }}"
      run: |
        cd dist
        tar -czvf WindBot.tar.gz .
        zip -r WindBot.zip .
        gh release create "$TAG_NAME" WindBot.tar.gz WindBot.zip --title "$TAG_NAME" --generate-notes
